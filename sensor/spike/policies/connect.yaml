# Outbound TCP connections, minus loopback (filtered in the kernel).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: selenne-connect
spec:
  kprobes:
  - call: "tcp_connect"
    syscall: false
    args:
    - index: 0
      type: "sock"
    selectors:
    - matchArgs:
      - index: 0
        operator: "NotDAddr"
        values:
        - "127.0.0.0/8"
        - "::1"
