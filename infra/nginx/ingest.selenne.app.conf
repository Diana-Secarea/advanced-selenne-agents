# nginx for https://ingest.selenne.app — TLS in front of the selenne-agents
# ingest container (127.0.0.1:4317 gRPC, 127.0.0.1:4318 HTTP).
#
#   sudo cp ingest.selenne.app.conf /etc/nginx/sites-available/selenne-ingest
#   sudo ln -s /etc/nginx/sites-available/selenne-ingest /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ingest.selenne.app
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare: OTLP/gRPC only works through a proxied (orange-cloud) record if
# gRPC is enabled for the zone (Network -> gRPC). Otherwise make this record
# DNS-only. Symptom when wrong: OTLP/HTTP works, OTLP/gRPC fails with
# UNAVAILABLE / protocol errors.
#
# Client IPs: the same /etc/nginx/conf.d/cloudflare-realip.conf that Selenne
# uses applies here too, so the per-IP limit below sees real visitors.

# Coarse per-IP flood guard in front of the per-key limiter in the app.
limit_req_zone $binary_remote_addr zone=selenne_ingest:10m rate=50r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                              # required for gRPC
    server_name ingest.selenne.app;

    ssl_certificate     /etc/letsencrypt/live/ingest.selenne.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingest.selenne.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5m;               # matches INGEST_MAX_BODY_BYTES
    limit_req zone=selenne_ingest burst=100 nodelay;
    limit_req_status 429;

    # OTLP/gRPC
    location /opentelemetry.proto.collector.trace.v1.TraceService/ {
        grpc_pass grpc://127.0.0.1:4317;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 30s;
        grpc_send_timeout 30s;
    }

    # OTLP/HTTP, native JSON, sensor events, liveness
    location ~ ^/(v1/traces|v1/events|v1/host-events|health)$ {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }

    # Nothing else lives on this host (/ready stays internal).
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ingest.selenne.app;
    return 301 https://$host$request_uri;
}
